plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}


// The project's client regression tests are plain Java "main" entry points,
// not JUnit classes. Gradle's Test discovery alone cannot execute them. Run
// every self-test as a real, failure-propagating JavaExec task during `build`.
// Gradle's native test discovery stays available for future JUnit tests.
def clientSelfTestMainClasses = [
    cfArrowMotionSelfTest: 'dev.cf.client.CFArrowMotionSelfTest',
    cfGraphicsSettingsSelfTest: 'dev.cf.client.CFGraphicsSettingsSelfTest',
    cfBuildPreviewSelfTest: 'dev.cf.client.CFBuildPreviewSelfTest',
    cfBuildEconomySelfTest: 'dev.cf.client.CFBuildEconomySelfTest',
    cfInventorySlotHitSelfTest: 'dev.cf.client.CFInventorySlotHitSelfTest',
    cfOverlayMeshSelfTest: 'dev.cf.client.render.CFOverlayMeshSelfTest',
    cfOverlayWireClientSelfTest: 'dev.cf.client.render.CFOverlayWireClientSelfTest'
]

clientSelfTestMainClasses.each { testTaskName, selfTestClass ->
    tasks.register(testTaskName, JavaExec) {
        group = 'verification'
        description = "Executes Castle Fight client regression check: ${selfTestClass}"
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = selfTestClass
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
        jvmArgs '-ea'
    }
}

tasks.named('test', Test) {
    dependsOn clientSelfTestMainClasses.keySet()
    // The plain-main regression tests are executed above, so zero JUnit
    // test methods is expected. Do NOT disable the Test task or self-tests.
    failOnNoDiscoveredTests = false
}
